name: Run Telegram Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Chrome and ChromeDriver
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true
          install-dependencies: true

      - name: Install Python Dependencies
        run: pip install python-telegram-bot selenium cryptography

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          timeout 240 python3 bot.py || echo "Bot stopped after timeout"

      - name: Commit Database Back
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add shop_database.db
          git diff --quiet && git diff --staged --quiet || git commit -m "Update database"
          git push
        continue-on-error: true
